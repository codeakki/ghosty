name: firmware
on:
  push: { paths: ["firmware/**", ".github/workflows/firmware.yml"] }
  pull_request: { paths: ["firmware/**"] }
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jlumbroso/free-disk-space@v2.0.0
        with: { tool-cache: false }
      - name: Stub secrets
        run: cp firmware/libraries/GhostyBoard/src/secrets.h.example firmware/libraries/GhostyBoard/src/secrets.h
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12
          libraries: |
            - source-path: ./firmware/libraries/GhostyBoard
          sketch-paths: |
            - firmware/sketches
          enable-warnings-report: true
